<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角丝旁行侠记 · 拔刀相助</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="game">
  <div class="scene">
    <!-- 夕阳古道 -->
    <div class="scene-layer bg-trail" data-bg="bg-trail">
      <div class="sun"></div>
      <div class="far-hill"></div>
      <div class="near-hill"></div>
      <div class="bamboo" style="left:6%;bottom:10%;height:120px;--rot:8deg"><span class="leaf" style="top:14px;left:8px;--lr:30deg"></span><span class="leaf" style="top:52px;left:8px;--lr:-24deg"></span></div>
      <div class="bamboo" style="left:88%;bottom:9%;height:100px;--rot:-10deg"><span class="leaf" style="top:10px;left:8px;--lr:40deg"></span><span class="leaf" style="top:44px;left:8px;--lr:-30deg"></span></div>
      <div class="ground"></div>
    </div>
    <!-- 茶摊 -->
    <div class="scene-layer bg-village" data-bg="bg-village">
      <div class="sun"></div>
      <div class="far-hill"></div>
      <div class="near-hill"></div>
      <svg class="stall" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 138 L 20 96 L 40 100 L 32 138 Z" fill="#6b4a2f"/>
        <path d="M 190 138 L 180 96 L 160 100 L 168 138 Z" fill="#6b4a2f"/>
        <path d="M 6 100 Q 100 52 194 100 L 186 88 Q 100 44 14 88 Z" fill="#a87a3a"/>
        <path d="M 0 104 Q 100 60 200 104 L 200 112 Q 100 70 0 112 Z" fill="#8a5f2e"/>
        <rect x="86" y="70" width="28" height="24" rx="3" fill="#e8d9b8"/>
        <text x="100" y="87" text-anchor="middle" font-size="14" fill="#5a3a22">茶</text>
        <rect x="70" y="120" width="60" height="18" rx="4" fill="#5a3a22"/>
      </svg>
      <div class="ground"></div>
    </div>
    <!-- 黑风寨 -->
    <div class="scene-layer bg-stronghold" data-bg="bg-stronghold">
      <div class="far-hill" style="opacity:.7"></div>
      <svg class="gate" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="30" width="18" height="120" fill="#3a2418"/>
        <rect x="172" y="30" width="18" height="120" fill="#3a2418"/>
        <rect x="10" y="20" width="200" height="26" rx="4" fill="#4a2e1c"/>
        <rect x="10" y="20" width="200" height="10" fill="#5a3a24"/>
        <rect x="54" y="46" width="112" height="104" fill="#2a1a12"/>
        <rect x="54" y="46" width="112" height="12" fill="#3a2418"/>
        <text x="110" y="112" text-anchor="middle" font-size="24" fill="#d9b06a" font-family="KaiTi,serif">黑风寨</text>
        <circle cx="110" cy="52" r="10" fill="none" stroke="#d9b06a" stroke-width="2"/>
      </svg>
      <span class="flame" style="left:8%;bottom:14%;width:26px;height:44px"></span>
      <span class="flame" style="left:84%;bottom:14%;width:26px;height:44px"></span>
      <div class="near-hill" style="opacity:.5"></div>
      <div class="ground"></div>
    </div>
  </div>

  <!-- 战斗区 -->
  <div class="arena" id="arena">
    <!-- 剑气弧光 -->
    <div class="blade" id="blade"></div>
    <!-- 主角 -->
    <div class="entity" id="heroEntity">
      <div class="fig" data-sprite="hero"></div>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <button class="btn small" id="btnTitle">← 标题</button>
    <div class="bar hero">
      <div class="label">角丝旁</div>
      <div class="track"><div class="fill" id="heroBarFill" style="width:100%"></div></div>
    </div>
    <div class="bar bossbar" id="bossBar">
      <div class="label">山寨主</div>
      <div class="track"><div class="fill" id="bossBarFill" style="width:100%"></div></div>
    </div>
    <span class="spacer"></span>
    <span class="wave-tag" id="waveTag">第一战 · 古道茶摊</span>
    <button class="btn small" id="btnMusic">♪ 音效：开</button>
  </div>

  <!-- 剧情条 -->
  <div class="dialog" id="dialog" style="display:none">
    <span class="speaker narrator" id="dialogSpeaker">旁白</span>
    <div class="text"><span id="dialogText"></span><span class="caret"></span></div>
    <span class="next" id="dialogNext" style="display:none">▼ 点击继续</span>
  </div>

  <!-- 触屏控制 -->
  <div class="touch-ctrl">
    <button class="tbtn tleft" id="tleft">◀</button>
    <button class="tbtn tright" id="tright">▶</button>
    <button class="tbtn tatk" id="tatk">拔 剑</button>
  </div>

  <div class="hurt-flash" id="hurtFlash"></div>
  <div class="controls-hint">← → 移动 · 空格 / J / 点击 挥剑</div>

  <!-- 结果 -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="tag">—— 角丝旁行侠记 ——</div>
      <div class="title" id="resultTitle"></div>
      <div class="desc" id="resultDesc"></div>
      <div class="actions">
        <button class="btn primary" id="btnRetry">再 战 一 场</button>
        <button class="btn" id="btnTitleEnd">返 回 标 题</button>
      </div>
    </div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/sprite.js"></script>
<script src="js/game.js"></script>
</body>
</html>
